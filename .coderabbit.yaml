# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# لغة مراجعة الأكواد (اختر "ar" لتصلك التعليقات بالعربية، أو "en-US" للإنجليزية)
language: "ar" 

reviews:
  # نمط مراجعة دقيق وصارم للمشاكل والأخطاء البرمجية
  profile: "assertive" 
  
  # توجيهات مخصصة لملفات مشروعك الحساسة
  path_instructions:
    - path: "lib/core/utils/calculator_helper.dart"
      instructions: |
        يرجى التدقيق الرياضي والمالي الصارم في هذا الملف لتجنب أي حالات قسمة على الصفر
        أو فقدان الدقة في حساب قيم الأمتار والتقريبات المالية.
        
    - path: "lib/**/*_cubit.dart"
      instructions: |
        تأكد بشكل صارم من إغلاق كافة اشتراكات البث المباشر (StreamSubscription)
        أو معالجتها بأمان لمنع حدوث تسريبات في الذاكرة (Memory Leaks).