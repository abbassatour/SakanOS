# توجيهات مخصصة للذكاء الاصطناعي لفحص كود مشروعك
instructions: |
  This is a Flutter Desktop (Windows) application using BLoC/Cubit for state management, 
  and Drift (SQLite) for local storage. 
  Please ensure that:
  - All stream subscriptions (StreamSubscription) are properly cancelled/disposed in Cubits to avoid memory leaks.
  - All database queries or writes are correctly handled with 'await' and enclosed in transactions where needed.
  - Financial calculations related to currency or area conversion are verified for edge cases like division by zero or precision loss.