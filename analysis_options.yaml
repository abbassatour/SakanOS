include:
  - package:very_good_analysis/analysis_options.yaml
  - package:bloc_lint/recommended.yaml

analyzer:
  exclude:
    - lib/l10n/gen/*
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/generated_plugin_registrant.dart"
  errors:
    # تجاهل الأخطاء التي تظهر بسبب استيراد حزم داخلية (مثل local_storage_api)
    depend_on_referenced_packages: ignore
    
    # تجاهل تحذيرات العناصر القديمة (التي تظهر مع Radio و Switch وغيرها من تحديثات فلاتر)
    deprecated_member_use: ignore

linter:
  rules:
    # --------------------------------------------------------
    # 🛑 القواعد الشكلية المزعجة التي تم إيقافها (لا تؤثر على الجودة)
    # --------------------------------------------------------
    
    # إيقاف إجبار كتابة التوثيق (موقوفة مسبقاً من قبلك)
    public_member_api_docs: false
    
    # إيقاف التقييد بـ 80 حرف للسطر (أكثر قاعدة مزعجة في Flutter)
    lines_longer_than_80_chars: false
    
    # إيقاف إجبار استخدام النقاط المتتابعة (..) لأنها تقلل المقروئية أحياناً
    cascade_invocations: false
    
    # إيقاف الإجبار على ترتيب الاستيرادات أبجدياً
    directives_ordering: false
    
    # إيقاف إجبار حذف القيم الافتراضية إذا كنت تريد كتابتها للتوضيح
    avoid_redundant_argument_values: false
    
    # السماح بكتابة أنواع المتغيرات (var مقابل String) لزيادة المقروئية
    omit_local_variable_types: false
    
    # إيقاف التحذير عند استخدام نصوص خام (Raw Strings)
    unnecessary_raw_strings: false
    
    # السماح بمقارنة المتغيرات بـ == true (مفيدة جداً للمتغيرات التي تقبل Null)
    no_literal_bool_comparisons: false
    
    # السماح باستخدام catch (e) بدون تحديد نوع الخطأ on Exception
    avoid_catches_without_on_clauses: false
    
    # السماح بالوصول الديناميكي (مهم جداً عند التعامل مع JSON)
    avoid_dynamic_calls: false